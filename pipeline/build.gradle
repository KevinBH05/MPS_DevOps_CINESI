plugins {
    id 'base'
}

def repoRoot = projectDir.parentFile

tasks.register('restore', Exec) {
    workingDir repoRoot
    commandLine 'dotnet', 'restore'
}

tasks.register('compile', Exec) {
    dependsOn 'restore'
    workingDir repoRoot
    commandLine 'dotnet', 'build', '--configuration', 'Release', '--no-restore'
}

tasks.register('runTests', Exec) {
    dependsOn 'compile'
    workingDir repoRoot
    doFirst {
        file("$projectDir/test-results/test").mkdirs()
    }
    commandLine 'dotnet', 'test',
            '--configuration', 'Release',
            '--no-build',
            '--logger', "junit;LogFilePath=$projectDir/test-results/test/test-results.xml"
}

tasks.register('test') {
    dependsOn 'runTests'
}

tasks.register('packageBuild', Tar) {
    dependsOn 'compile'
    archiveFileName = 'build-artifacts.tar.gz'
    destinationDirectory = projectDir
    compression = Compression.GZIP
    from(repoRoot) {
        exclude 'pipeline/build'
        exclude 'pipeline/.gradle'
        exclude 'pipeline/test-results'
        exclude 'pipeline/build-artifacts.tar.gz'
        exclude '**/bin'
        exclude '**/obj'
        exclude '**/TestResults'
        exclude '.git'
    }
}

tasks.named('build') {
    dependsOn 'compile'
}