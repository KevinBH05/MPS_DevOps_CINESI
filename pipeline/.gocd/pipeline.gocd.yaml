format_version: 10
pipelines:
  net-web-pipeline:
    group: defaultGroup
    materials:
      git-repo:
        git: https://github.com/KevinBH05/MPS_DevOps_CINESI.git
        branch: main
    stages:
      - docker-stage:
          jobs:
            build-image:
              tasks:
                - exec:
                    command: docker
                    arguments:
                      - build
                      - -t
                      - cinesi-web:latest
                      - .

      - deploy-stage:
          jobs:
            deploy-web:
              tasks:
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - |
                        docker stop cinesi-app || true
                        docker rm cinesi-app || true
                        docker run -d --name cinesi-app -p 8080:8080 cinesi-web:latest