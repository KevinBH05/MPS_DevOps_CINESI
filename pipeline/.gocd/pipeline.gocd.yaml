format_version: 10
pipelines:
  net-web-pipeline:
    group: defaultGroup
    materials:
      git-repo:
        git: https://github.com/KevinBH05/MPS_DevOps_CINESI.git
        branch: main
    stages:
      - build-stage:
          jobs:
            compile:
              tasks:
                - exec:
                    command: gradle
                    arguments:
                      - packageBuild
              artifacts:
                - build:
                    source: build-artifacts.tar.gz

      - test-stage:
          jobs:
            run-xunit:
              tasks:
                - fetch:
                    stage: build-stage
                    job: compile
                    source: build-artifacts.tar.gz
                    is_file: true
                - exec:
                    command: tar
                    arguments:
                      - -xzf
                      - build-artifacts.tar.gz
                - exec:
                    command: gradle
                    arguments:
                      - test
              artifacts:
                - test:
                    source: '**/TestResults/*.trx'
                    destination: test-reports

      - docker-stage:
          jobs:
            build-image:
              tasks:
                - exec:
                    command: docker
                    arguments:
                      - build
                      - -t
                      - cinesi-web:latest
                      - .

      - deploy-stage:
          jobs:
            deploy-web:
              tasks:
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - |
                        echo "Parando contenedor anterior..."
                        docker stop cinesi-app || true
                        docker rm cinesi-app || true

                        echo "Lanzando nueva versión..."
                        docker run -d --name cinesi-app -p 8080:8080 cinesi-web:latest