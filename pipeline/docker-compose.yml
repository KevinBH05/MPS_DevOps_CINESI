services:
  gocd-server:
    build: .
    ports:
      - "8153:8153"
      - "8154:8154"
    environment:
      - AGENT_AUTO_REGISTER_KEY=CINESI-AGENT-KEY
    volumes:
      - gocd-data:/godata

  gocd-agent:
    image: gocd/gocd-agent-docker-dind:v26.1.0
    privileged: true
    environment:
      - GO_SERVER_URL=http://gocd-server:8153/go
      - AGENT_AUTO_REGISTER_KEY=CINESI-AGENT-KEY
    depends_on:
      - gocd-server

volumes:
  gocd-data: